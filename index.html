<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הוכחות אינפי 1 🎓</title>
<script>
MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$']], tags: 'none' },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root {
  --primary: #3949ab;
  --accent: #7c4dff;
  --gold: #ffd54f;
  --gold-dark: #f9a825;
  --green: #4caf50;
  --red: #ef5350;
  --bg: #080818;
  --card: rgba(255,255,255,0.06);
  --card-hover: rgba(255,255,255,0.11);
  --text: #e8eaf6;
  --muted: #9fa8da;
  --border: rgba(255,255,255,0.09);
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  direction:rtl;
  overflow-x:hidden;
}
/* ── ANIMATED BG ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 15% 15%,rgba(57,73,171,.35) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 85%,rgba(124,77,255,.28) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 55% 5%,rgba(25,118,210,.18) 0%,transparent 45%);
  animation:bgPulse 10s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:0;
}
@keyframes bgPulse{0%{opacity:.7}100%{opacity:1}}

.math-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.math-float{
  position:absolute;opacity:.04;color:#fff;-webkit-user-select:none;user-select:none;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  8%{opacity:.04}92%{opacity:.04}
  100%{transform:translateY(-120px) rotate(360deg);opacity:0}
}

/* ── HEADER ── */
header{
  background:rgba(8,8,24,.82);
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  padding:15px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
header h1{
  font-size:1.45rem;font-weight:900;
  background:linear-gradient(120deg,#fff 0%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#hud{display:flex;gap:12px;align-items:center}
.hud-box{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,.11);
  border-radius:12px;padding:7px 16px;
  font-weight:700;font-size:.9rem;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  transition:box-shadow .3s;
}
.hud-box.bump{animation:hudBump .45s ease}
@keyframes hudBump{0%,100%{transform:scale(1)}50%{transform:scale(1.15);box-shadow:0 0 22px rgba(255,213,79,.55)}}
.hud-box .val{color:var(--gold);font-size:1.05rem}

/* ── SCREENS ── */
.screen{display:none;opacity:0;position:relative;z-index:1}
.screen.active{display:block;animation:fadeUp .4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ── HOME ── */
#home{max-width:980px;margin:0 auto;padding:44px 20px;text-align:center}
.home-hero{margin-bottom:42px}
#home h2{
  font-size:2.5rem;font-weight:900;line-height:1.2;
  background:linear-gradient(130deg,#fff 0%,var(--gold) 55%,#e040fb 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;
}
.home-sub{color:var(--muted);font-size:1.1rem;line-height:1.7;margin-bottom:18px}
.stats-bar{display:flex;justify-content:center;gap:16px;margin:18px 0 38px;flex-wrap:wrap}
.stat-chip{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
  border-radius:30px;padding:8px 20px;font-size:.85rem;font-weight:700;color:var(--muted);
}
.stat-chip span{color:var(--gold)}
.topic-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:16px;text-align:right;
}
.topic-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px 20px;
  box-shadow:var(--shadow);cursor:pointer;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .22s,border-color .22s,box-shadow .22s,background .22s;
  position:relative;overflow:hidden;
}
.topic-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(124,77,255,.12) 0%,transparent 60%);
  opacity:0;transition:opacity .22s;
}
.topic-card:hover{
  transform:translateY(-7px);
  border-color:rgba(124,77,255,.5);
  box-shadow:0 22px 48px rgba(0,0,0,.55),0 0 30px rgba(124,77,255,.2);
  background:var(--card-hover);
}
.topic-card:hover::after{opacity:1}
.tc-icon{font-size:2.5rem;margin-bottom:12px;display:block}
.tc-title{font-size:1.02rem;font-weight:800;color:#fff;margin-bottom:6px}
.tc-sub{font-size:.79rem;color:var(--muted);line-height:1.5}
.tc-stars{position:absolute;top:14px;left:14px;font-size:.88rem;color:var(--gold);text-shadow:0 0 8px rgba(255,213,79,.6)}
.tc-badge{
  display:inline-block;
  background:linear-gradient(135deg,#3949ab,#7c4dff);
  color:#fff;border-radius:20px;padding:3px 12px;
  font-size:.71rem;font-weight:700;margin-top:10px;
}
.topic-card.done .tc-badge{background:linear-gradient(135deg,#2e7d32,#00c853)}

/* ── TOPIC SCREEN ── */
#topic-screen{max-width:880px;margin:0 auto;padding:30px 20px}
.back-btn{
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--muted);border-radius:12px;padding:8px 20px;
  font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:22px;
  transition:all .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.back-btn:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}
#topic-title{
  font-size:1.75rem;font-weight:900;margin-bottom:10px;
  background:linear-gradient(130deg,#fff 0%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#topic-desc{
  color:var(--muted);margin-bottom:22px;line-height:1.75;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px 20px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:.92rem;
}
.mode-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.mode-btn{
  flex:1;min-width:128px;padding:12px 8px;
  border-radius:14px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.05);color:var(--muted);
  font-size:.87rem;font-weight:700;cursor:pointer;
  transition:all .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.mode-btn:hover{background:rgba(124,77,255,.18);color:#fff;border-color:rgba(124,77,255,.38)}
.mode-btn.active{
  background:linear-gradient(135deg,#3949ab,#7c4dff);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 18px rgba(124,77,255,.42);
}

/* ── PROGRESS ── */
.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.progress-bar-wrap{
  flex:1;height:8px;
  background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--gold));
  border-radius:20px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(124,77,255,.5);
}
.progress-label{font-size:.84rem;color:var(--muted);font-weight:700;white-space:nowrap}

/* ── QUESTION BOX ── */
#game-area{min-height:400px}
.question-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px 26px;
  box-shadow:var(--shadow);margin-bottom:20px;
  line-height:1.8;-webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  animation:slideIn .35s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.q-label{
  font-size:.74rem;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.q-label::after{content:'';flex:1;height:1px;background:var(--border)}
.q-text{font-size:1.05rem;font-weight:600;margin-bottom:20px;line-height:1.9;color:var(--text)}

/* ── ORDER ── */
.steps-container{display:flex;flex-direction:column;gap:10px}
.step-item{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:13px 18px;cursor:grab;
  display:flex;align-items:center;gap:12px;
  transition:all .2s;-webkit-user-select:none;user-select:none;
  font-size:.95rem;line-height:1.6;color:var(--text);
}
.step-item:hover{background:rgba(124,77,255,.14);border-color:rgba(124,77,255,.3);transform:translateX(-4px)}
.step-item.dragging{opacity:.4;transform:scale(.97)}
.step-item.drag-over{border-color:#7c4dff;background:rgba(124,77,255,.18)}
.step-item.correct-pos{border-color:var(--green);background:rgba(76,175,80,.13)!important;box-shadow:0 0 14px rgba(76,175,80,.2)}
.step-item.wrong-pos{border-color:var(--red);background:rgba(239,83,80,.13)!important}
.step-num{
  min-width:32px;height:32px;flex-shrink:0;
  background:linear-gradient(135deg,#3949ab,#7c4dff);
  color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85rem;
  box-shadow:0 2px 8px rgba(124,77,255,.35);
}
.drag-handle{color:rgba(255,255,255,.25);font-size:1.2rem;flex-shrink:0}

/* ── MCQ ── */
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:14px 20px;cursor:pointer;
  font-size:.96rem;text-align:right;
  transition:all .2s;line-height:1.6;color:var(--text);
}
.choice-btn:hover:not(:disabled){background:rgba(124,77,255,.14);border-color:rgba(124,77,255,.35);transform:translateX(-4px)}
.choice-btn.correct{border-color:var(--green);background:rgba(76,175,80,.14);color:#a5d6a7;font-weight:700;box-shadow:0 0 16px rgba(76,175,80,.2)}
.choice-btn.wrong{border-color:var(--red);background:rgba(239,83,80,.14);color:#ef9a9a;font-weight:700}

/* ── TF ── */
.tf-row{display:flex;gap:14px;margin-top:18px}
.tf-btn{
  flex:1;padding:18px;border-radius:16px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.05);
  font-size:1.15rem;font-weight:800;cursor:pointer;
  transition:all .2s;color:var(--text);
}
.tf-btn:hover:not(:disabled){background:rgba(124,77,255,.16);border-color:rgba(124,77,255,.38);transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.tf-btn.correct{border-color:var(--green);background:rgba(76,175,80,.15);color:#a5d6a7;box-shadow:0 0 22px rgba(76,175,80,.3)}
.tf-btn.wrong{border-color:var(--red);background:rgba(239,83,80,.15);color:#ef9a9a}

/* ── FILL ── */
.blank-input{
  border:1.5px solid rgba(255,255,255,.14);border-radius:12px;
  padding:12px 16px;font-size:1rem;width:100%;margin-top:14px;
  outline:none;direction:ltr;
  background:rgba(255,255,255,.06);color:var(--text);
  transition:all .2s;
}
.blank-input:focus{border-color:#7c4dff;box-shadow:0 0 0 3px rgba(124,77,255,.22);background:rgba(124,77,255,.09)}
.blank-input.correct{border-color:var(--green);background:rgba(76,175,80,.12);box-shadow:0 0 14px rgba(76,175,80,.22)}
.blank-input.wrong{border-color:var(--red);background:rgba(239,83,80,.12)}
.hint-box{
  background:rgba(255,213,79,.07);border:1px solid rgba(255,213,79,.18);
  border-radius:10px;padding:10px 14px;font-size:.84rem;
  color:#ffe082;margin-top:8px;line-height:1.5;
}

/* ── FEEDBACK ── */
.feedback-box{
  border-radius:14px;padding:16px 20px;
  margin-top:18px;font-weight:600;font-size:.95rem;
  line-height:1.7;display:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.feedback-box.show{display:block;animation:fbPop .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes fbPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.feedback-box.good{background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.4);color:#a5d6a7}
.feedback-box.bad{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.4);color:#ef9a9a}

/* ── BUTTONS ── */
.btn-primary{
  background:linear-gradient(135deg,#3949ab,#7c4dff);
  color:#fff;border:none;border-radius:14px;
  padding:14px 32px;font-size:1rem;font-weight:800;
  cursor:pointer;margin-top:16px;
  box-shadow:0 6px 20px rgba(124,77,255,.38);
  transition:all .2s;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(124,77,255,.52)}
.btn-check{
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#1a1a2e;border:none;border-radius:12px;
  padding:12px 28px;font-size:.95rem;font-weight:800;
  cursor:pointer;margin-top:14px;
  box-shadow:0 4px 14px rgba(249,168,37,.32);
  transition:all .2s;
}
.btn-check:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(249,168,37,.5)}

/* ── RESULT ── */
#result-screen{max-width:620px;margin:0 auto;padding:52px 20px;text-align:center}
.result-emoji{font-size:5.5rem;display:block;margin-bottom:16px;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes bounceIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.result-title{
  font-size:2.2rem;font-weight:900;margin-bottom:10px;
  background:linear-gradient(135deg,#fff,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-score{font-size:1.2rem;color:var(--muted);margin-bottom:28px}
.stars-row{
  font-size:3rem;margin-bottom:28px;color:var(--gold);
  text-shadow:0 0 22px rgba(255,213,79,.65);
  animation:starPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes starPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.result-breakdown{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px 26px;
  box-shadow:var(--shadow);text-align:right;
  margin-bottom:28px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.result-breakdown h3{font-size:.95rem;margin-bottom:14px;color:var(--muted)}
.rb-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}
.rb-ok{color:var(--green);font-weight:800}
.rb-no{color:var(--red);font-weight:800}

/* ── CONFETTI ── */
.confetti-p{
  position:fixed;width:9px;height:9px;border-radius:2px;
  pointer-events:none;z-index:9999;
  animation:cfFall 1.3s ease-in forwards;
}
@keyframes cfFall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ── ANIMATIONS ── */
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s ease}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  header{padding:12px 14px}
  header h1{font-size:1rem}
  #home h2{font-size:1.7rem}
  .topic-grid{grid-template-columns:1fr}
  .mode-row{flex-direction:column}
  .question-box{padding:20px 16px}
  .tf-row{flex-direction:column}
  #hud{gap:8px}
  .hud-box{padding:6px 10px;font-size:.82rem}
}
</style>
</head>
<body>

<div class="math-bg" id="math-bg"></div>

<header>
  <h1>🎓 אינפי 1 — משחק הוכחות</h1>
  <div id="hud">
    <div class="hud-box" id="score-box">ניקוד: <span class="val" id="score-display">0</span></div>
    <div class="hud-box" id="streak-box">🔥 <span class="val" id="streak-display">0</span></div>
  </div>
</header>

<div id="home" class="screen active">
  <div class="home-hero">
    <h2>משחק הוכחות אינפי 1</h2>
    <p class="home-sub">תרגל הוכחות מתמטיקה עם משחקים אינטראקטיביים<br>סדר שלבים · רב-ברירה · נכון/שקר · מילוי חסר</p>
    <div class="stats-bar">
      <div class="stat-chip">נושאים: <span id="stat-topics">0</span></div>
      <div class="stat-chip">ניקוד כולל: <span id="stat-score">0</span></div>
      <div class="stat-chip">הושלמו: <span id="stat-done">0</span></div>
    </div>
  </div>
  <div class="topic-grid" id="topic-grid"></div>
</div>

<div id="topic-screen" class="screen">
  <button class="back-btn" onclick="showHome()">← חזרה לנושאים</button>
  <div id="topic-title"></div>
  <div id="topic-desc"></div>
  <div class="mode-row" id="mode-row"></div>
  <div class="progress-row">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 0</div>
  </div>
  <div id="game-area"></div>
</div>

<div id="result-screen" class="screen">
  <span class="result-emoji" id="result-emoji">🎉</span>
  <div class="result-title" id="result-title">כל הכבוד!</div>
  <div class="result-score" id="result-score"></div>
  <div class="stars-row" id="result-stars"></div>
  <div class="result-breakdown" id="result-breakdown"></div>
  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="btn-primary" onclick="showHome()">⬅ לנושאים</button>
    <button class="btn-primary" id="replay-btn">🔄 שחק שוב</button>
  </div>
</div>

<script>
// ── FLOATING BACKGROUND ──
const mathSymbols=['∫','∑','∞','∂','∇','Δ','π','√','∀','∃','⟹','≤','≥','∈','⊂','∩','∪','lim','ε','δ','f\'','d/dx'];
const bg=document.getElementById('math-bg');
for(let i=0;i<22;i++){
  const el=document.createElement('span');
  el.className='math-float';
  el.textContent=mathSymbols[Math.floor(Math.random()*mathSymbols.length)];
  el.style.cssText=`left:${Math.random()*100}%;animation-duration:${12+Math.random()*22}s;animation-delay:${-Math.random()*24}s;font-size:${1+Math.random()*2.5}rem;`;
  bg.appendChild(el);
}

// ── CONFETTI ──
function confetti(x,y){
  const colors=['#ffd54f','#7c4dff','#4caf50','#e040fb','#29b6f6','#ff7043'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div');
    p.className='confetti-p';
    p.style.cssText=`left:${x-40+Math.random()*80}px;top:${y}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${Math.random()*.3}s;animation-duration:${.9+Math.random()*.6}s;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }
}

// ── DATA ──
const TOPICS=[
{
  id:'limit-order',icon:'⚖️',title:'תכונות סדר של גבולות',
  sub:'אם lim f=L ו-lim g=M, מה קורה כשמשווים?',
  badge:'גבולות',modes:['order','mcq','tf','fill'],
  proof:{
    title:'משפט: תכונות סדר של גבולות',

  sub:'קיים $c$ כך שהנגזרת שווה לשיפוע המיתר',
  badge:'גזירה',modes:['order','mcq','tf','fill'],
  proof:{
    title:'משפט ערך הממוצע של לגראנז\'',
    statement:'תהי $f$ רציפה על $[a,b]$ וגזירה ב-$(a,b)$. אז קיים $c\\in(a,b)$ כך ש-$f\'(c)=\\dfrac{f(b)-f(a)}{b-a}$.',
    idea:'נגדיר $g(x)=f(x)-\\frac{f(b)-f(a)}{b-a}(x-a)$ — זוהי $f$ פחות המיתר. אז $g(a)=g(b)=f(a)$, ולכן לפי משפט רול קיים $c$ עם $g\'(c)=0$, כלומר $f\'(c)=\\frac{f(b)-f(a)}{b-a}$.'
  },
  questions:[
    {type:'order',prompt:'סדרו את שלבי הוכחת משפט לגראנז\':',
     steps:['נגדיר $g(x)=f(x)-\\dfrac{f(b)-f(a)}{b-a}(x-a)$','$g(a)=f(a)$ ו-$g(b)=f(b)-[f(b)-f(a)]=f(a)$, לכן $g(a)=g(b)$','$g$ רציפה על $[a,b]$ וגזירה ב-$(a,b)$ (כי $f$ כך)','לפי משפט רול קיים $c\\in(a,b)$ עם $g\'(c)=0$','$g\'(x)=f\'(x)-\\dfrac{f(b)-f(a)}{b-a}$, לכן $g\'(c)=0$ נותן $f\'(c)=\\dfrac{f(b)-f(a)}{b-a}$'],
     answer:[0,1,2,3,4],explanation:'הגדרת g → שוויון בקצוות → רול → חישוב הנגזרת → מסקנה.'},
    {type:'mcq',prompt:'למה מגדירים $g(x) = f(x) - \\frac{f(b)-f(a)}{b-a}(x-a)$?',
     choices:['כי זה פשוט לחשב','כי זוהי $f$ פחות קו המיתר — וכך $g(a)=g(b)$ ומשפט רול חל','כי $g$ תמיד מונוטונית','כי הגדרה זו מבטיחה $g\'=0$ בכל מקום'],
     answer:1,explanation:'הגדרת $g$ מחסירה את המיתר, כך שהקצוות שווים ורול חל לתת נקודה עם $g\'=0$.'},
    {type:'mcq',prompt:'מה ההבדל בין משפט רול למשפט לגראנז\'?',
     choices:['אין הבדל','רול הוא מקרה פרטי של לגראנז\' עם $f(a)=f(b)$','לגראנז\' דורש גזירה ברחבי $[a,b]$','לגראנז\' תקף רק לפולינומים'],
     answer:1,explanation:'כאשר $f(a)=f(b)$, שיפוע המיתר הוא $0$ ומשפט לגראנז\' נותן $f\'(c)=0$ — זהו בדיוק רול.'},
    {type:'tf',prompt:'אם $f\'(x)=0$ לכל $x\\in(a,b)$, אז $f$ קבועה על $[a,b]$ (לפי לגראנז\').',
     answer:true,explanation:'נכון! לכל $x,y\\in[a,b]$: לפי לגראנז\' $f(y)-f(x)=f\'(c)(y-x)=0$, לכן $f(x)=f(y)$.'},
    {type:'tf',prompt:'אפשר לבחור $c$ כרצוננו בתוך $(a,b)$ ולא קיים $c$ ספציפי.',
     answer:false,explanation:'שקר! המשפט אומר שקיים (לפחות) $c$ עם התכונה — אבל לא בהכרח שכל $c$ מתאים.'},
    {type:'fill',prompt:'בהוכחת לגראנז\', המשפט שמשתמשים בו על הפונקציה $g$ הוא משפט ___',
     answer:'רול',hint:'איזה משפט מוכיח נגזרת אפס?',explanation:'$g(a)=g(b)$, ולכן לפי משפט רול קיים $c$ עם $g\'(c)=0$.'},
    {type:'fill',prompt:'אם $f$ גזירה על $[a,b]$ ו-$|f\'(x)|\\le M$, אז לפי לגראנז\' $|f(b)-f(a)|\\le M \\cdot$ ___',
     answer:'(b-a)',hint:'מה אורך הקטע?',explanation:'$|f(b)-f(a)|=|f\'(c)|\\cdot|b-a|\\le M(b-a)$.'}
  ]
},
{
  id:'epsdelta',icon:'🔬',title:'הגדרת ε-δ לגבול',
  sub:'ההגדרה הפורמלית של גבול פונקציה',
  badge:'גבולות',modes:['mcq','tf','fill','order'],
  proof:{
    title:'הגדרת אפסילון-דלתא (Weierstrass)',
    statement:'$\\lim_{x\\to a}f(x)=L$ אמ"מ: לכל $\\varepsilon>0$ קיים $\\delta>0$ כך שאם $0<|x-a|<\\delta$ אז $|f(x)-L|<\\varepsilon$.',
    idea:'לכל רמת דיוק $\\varepsilon$ שנדרוש — נמצא $\\delta$ קטן מספיק כך שהפונקציה לא "מתרחקת" ב-$\\varepsilon$ מהגבול בכל הסביבה המנוקבת.'
  },
  questions:[
    {type:'mcq',prompt:'מה פירוש $0<|x-a|<\\delta$ בהגדרה?',
     choices:['$x$ נמצא ממש בין $a-\\delta$ ל-$a+\\delta$','$x$ נמצא בסביבה מנוקבת של $a$ ברדיוס $\\delta$ (לא כולל $a$ עצמו)','$x=a$','$|x|<\\delta$'],
     answer:1,explanation:'$0<|x-a|$ מבטיח $x\\ne a$ (סביבה מנוקבת). $|x-a|<\\delta$ מגביל את הקרבה ל-$a$.'},
    {type:'mcq',prompt:'להוכחה ש-$\\lim_{x\\to 2}(3x)=6$, בהינתן $\\varepsilon>0$ נבחר $\\delta=$?',
     choices:['$\\varepsilon$','$\\varepsilon/3$','$3\\varepsilon$','$\\varepsilon^2$'],
     answer:1,explanation:'$|3x-6|=3|x-2|<3\\delta$. כדי ש-$3\\delta\\le\\varepsilon$ נבחר $\\delta=\\varepsilon/3$.'},
    {type:'mcq',prompt:'מדוע כותבים $0<|x-a|$ ולא רק $|x-a|<\\delta$?',
     choices:['כי $|x-a|$ לא יכול להיות שלילי','כי גבול מוגדר לפי ערכים *ליד* $a$, לא ב-$a$ עצמו','כי $x=a$ גורם לחלוקה באפס','כי $\\delta$ יכול להיות שלילי'],
     answer:1,explanation:'הגבול מתאר התנהגות הפונקציה כאשר $x$ מתקרב ל-$a$, לא הערך ב-$a$ עצמו (שעשוי לא להיות מוגדר).'},
    {type:'tf',prompt:'ניתן לבחור $\\delta$ שתלוי ב-$x$ ולא רק ב-$\\varepsilon$.',
     answer:false,explanation:'שקר! $\\delta$ צריך להיות קבוע (תלוי ב-$\\varepsilon$ ו-$a$ בלבד) — אותו $\\delta$ חייב לעבוד לכל $x$ בסביבה.'},
    {type:'tf',prompt:'אם $\\lim_{x\\to a}f(x)=L$ ו-$f(a)=M\\ne L$, אז ההגדרה לא מתקיימת.',
     answer:false,explanation:'שקר! ההגדרה לא מצריכה ש-$f(a)=L$. הגבול עוסק בערכים *ליד* $a$, לא ב-$a$ עצמו.'},
    {type:'fill',prompt:'בהגדרה: לכל $\\varepsilon > 0$ קיים $\\delta > 0$ כך שאם $0<|x-a|<\\delta$ אז $|f(x)-L|<$ ___',
     answer:'ε',hint:'מה רמת הדיוק שמצריכים?',explanation:'$|f(x)-L|<\\varepsilon$ — הפונקציה צריכה להיות קרובה ל-$L$ ברמת דיוק $\\varepsilon$.'},
    {type:'order',prompt:'סדרו את שלבי הוכחה ש-$\\lim_{x\\to 3}(2x-1)=5$:',
     steps:['נתון $\\varepsilon>0$, צריך למצוא $\\delta>0$','נחשב: $|(2x-1)-5|=|2x-6|=2|x-3|$','כדי ש-$2|x-3|<\\varepsilon$, צריך $|x-3|<\\varepsilon/2$','נבחר $\\delta=\\varepsilon/2$','לכל $0<|x-3|<\\delta$: $|(2x-1)-5|=2|x-3|<2\\delta=\\varepsilon$ ✓'],
     answer:[0,1,2,3,4],explanation:'נחשב את $|f(x)-L|$ → מוצאים $\\delta$ → מאמתים.'}
  ]
}
];

// ── STATE ──
let state={
  score:0,streak:0,topicId:null,mode:'mcq',
  qIndex:0,answers:[],questions:[],topicStars:{}
};

// Load from localStorage
try{
  const saved=JSON.parse(localStorage.getItem('infi_state')||'{}');
  if(saved.score) state.score=saved.score;
  if(saved.topicStars) state.topicStars=saved.topicStars;
  document.getElementById('score-display').textContent=state.score;
}catch(e){}

function saveState(){
  try{localStorage.setItem('infi_state',JSON.stringify({score:state.score,topicStars:state.topicStars}));}catch(e){}
}

// ── HOME ──
function initHome(){
  const grid=document.getElementById('topic-grid');
  const done=Object.values(state.topicStars).filter(s=>s>=3).length;
  document.getElementById('stat-topics').textContent=TOPICS.length;
  document.getElementById('stat-score').textContent=state.score;
  document.getElementById('stat-done').textContent=done;
  grid.innerHTML=TOPICS.map(t=>{
    const stars=state.topicStars[t.id]||0;
    const starStr='★'.repeat(stars)+'☆'.repeat(3-stars);
    return `<div class="topic-card${stars>=3?' done':''}" onclick="openTopic('${t.id}')">
      <div class="tc-stars">${starStr}</div>
      <div class="tc-icon">${t.icon}</div>
      <div class="tc-title">${t.title}</div>
      <div class="tc-sub">${t.sub}</div>
      <span class="tc-badge">${t.badge}</span>
    </div>`;
  }).join('');
}

// ── NAVIGATION ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active')});
  const el=document.getElementById(id);
  el.classList.add('active');
}
function showHome(){showScreen('home');initHome();}

function openTopic(id){
  const topic=TOPICS.find(t=>t.id===id);
  state.topicId=id;
  document.getElementById('topic-title').textContent=topic.icon+' '+topic.title;
  document.getElementById('topic-desc').innerHTML=
    `<p style="margin-bottom:8px"><strong style="color:#fff">משפט:</strong> ${topic.proof.statement}</p>
     <p style="color:var(--muted);font-size:.88rem;margin-top:6px">💡 <strong>רעיון:</strong> ${topic.proof.idea}</p>`;
  const modeLabels={order:'🔀 סדר שלבים',mcq:'❓ רב-ברירה',tf:'✅ נכון/שקר',fill:'✏️ מלא חסר'};
  document.getElementById('mode-row').innerHTML=topic.modes.map((m,i)=>
    `<button class="mode-btn${i===0?' active':''}" onclick="setMode('${m}',this)">${modeLabels[m]}</button>`
  ).join('');
  state.mode=topic.modes[0];
  startGame(id,state.mode);
  showScreen('topic-screen');
  if(window.MathJax) MathJax.typesetPromise();
}

function setMode(mode,btn){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.mode=mode;
  startGame(state.topicId,mode);
}

// ── GAME LOGIC ──
function startGame(topicId,mode){
  const topic=TOPICS.find(t=>t.id===topicId);
  state.questions=topic.questions.filter(q=>q.type===mode);
  if(!state.questions.length){
    document.getElementById('game-area').innerHTML='<div class="question-box"><p>אין שאלות במצב זה עדיין.</p></div>';
    return;
  }
  state.qIndex=0;state.answers=[];
  updateProgress();renderQuestion();
}

function updateProgress(){
  const total=state.questions.length,done=state.qIndex;
  document.getElementById('progress-bar').style.width=(total?(done/total*100):0)+'%';
  document.getElementById('progress-label').textContent=`${done} / ${total}`;
}

function renderQuestion(){
  const q=state.questions[state.qIndex];
  if(!q){showResult();return;}
  updateProgress();
  let html='';
  if(q.type==='order') html=renderOrder(q);
  else if(q.type==='mcq') html=renderMCQ(q);
  else if(q.type==='tf') html=renderTF(q);
  else if(q.type==='fill') html=renderFill(q);
  document.getElementById('game-area').innerHTML=html;
  if(window.MathJax) MathJax.typesetPromise();
  if(q.type==='order') initDrag();
}

// ── ORDER ──
function renderOrder(q){
  const shuffled=[...q.steps].map((s,i)=>({text:s,origIdx:i})).sort(()=>Math.random()-.5);
  window._orderData={q,shuffled};
  return `<div class="question-box">
    <div class="q-label">🔀 סדרו את השלבים</div>
    <div class="q-text">${q.prompt}</div>
    <div class="steps-container" id="steps-list">
      ${shuffled.map((s,i)=>`
        <div class="step-item" draggable="true" data-idx="${i}" data-orig="${s.origIdx}">
          <span class="drag-handle">⠿</span>
          <span class="step-num">${i+1}</span>
          <span class="step-text">${s.text}</span>
        </div>`).join('')}
    </div>
    <div class="feedback-box" id="feedback"></div>
    <button class="btn-check" onclick="checkOrder()">בדוק סדר ✓</button>
  </div>`;
}

function initDrag(){
  const list=document.getElementById('steps-list');
  if(!list) return;
  let dragEl=null;
  list.addEventListener('dragstart',e=>{
    dragEl=e.target.closest('.step-item');
    if(dragEl) dragEl.classList.add('dragging');
  });
  list.addEventListener('dragend',e=>{
    if(dragEl) dragEl.classList.remove('dragging');
    dragEl=null;updateStepNumbers();
  });
  list.addEventListener('dragover',e=>{
    e.preventDefault();
    const target=e.target.closest('.step-item');
    if(target&&target!==dragEl){
      const r=target.getBoundingClientRect();
      if(e.clientY-r.y<r.height/2) list.insertBefore(dragEl,target);
      else list.insertBefore(dragEl,target.nextSibling);
    }
  });
}

function updateStepNumbers(){
  document.querySelectorAll('.step-item').forEach((el,i)=>{
    el.querySelector('.step-num').textContent=i+1;
  });
}

function checkOrder(){
  const{q}=window._orderData;
  const items=[...document.querySelectorAll('.step-item')];
  const correctOrder=q.answer;
  let allCorrect=true;
  items.forEach((el,i)=>{
    if(parseInt(el.dataset.orig)===correctOrder[i]){el.classList.add('correct-pos');el.classList.remove('wrong-pos');}
    else{el.classList.add('wrong-pos');el.classList.remove('correct-pos');allCorrect=false;}
  });
  showFeedback(allCorrect,q.explanation);
  if(allCorrect){earnPoints(20);spawnConfetti();setTimeout(nextQuestion,1800);}
  if(window.MathJax) MathJax.typesetPromise();
}

// ── MCQ ──
function renderMCQ(q){
  return `<div class="question-box">
    <div class="q-label">❓ בחר תשובה נכונה</div>
    <div class="q-text">${q.prompt}</div>
    <div class="choices">
      ${q.choices.map((c,i)=>`<button class="choice-btn" onclick="checkMCQ(${i},this)">${c}</button>`).join('')}
    </div>
    <div class="feedback-box" id="feedback"></div>
  </div>`;
}

function checkMCQ(idx,btn){
  const q=state.questions[state.qIndex];
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if(idx===q.answer){
    btn.classList.add('correct');showFeedback(true,q.explanation);earnPoints(10);spawnConfetti();setTimeout(nextQuestion,1800);
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn')[q.answer].classList.add('correct');
    showFeedback(false,q.explanation);setTimeout(nextQuestion,2600);
  }
}

// ── TF ──
function renderTF(q){
  return `<div class="question-box">
    <div class="q-label">✅ נכון או שקר?</div>
    <div class="q-text">${q.prompt}</div>
    <div class="tf-row">
      <button class="tf-btn" onclick="checkTF(true,this)">✓ נכון</button>
      <button class="tf-btn" onclick="checkTF(false,this)">✗ שקר</button>
    </div>
    <div class="feedback-box" id="feedback"></div>
  </div>`;
}

function checkTF(val,btn){
  const q=state.questions[state.qIndex];
  document.querySelectorAll('.tf-btn').forEach(b=>b.disabled=true);
  if(val===q.answer){
    btn.classList.add('correct');showFeedback(true,q.explanation);earnPoints(10);spawnConfetti();setTimeout(nextQuestion,1800);
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('.tf-btn').forEach(b=>{
      if((b.textContent.includes('נכון')&&q.answer)||(b.textContent.includes('שקר')&&!q.answer)) b.classList.add('correct');
    });
    showFeedback(false,q.explanation);setTimeout(nextQuestion,2600);
  }
}

// ── FILL ──
function renderFill(q){
  return `<div class="question-box">
    <div class="q-label">✏️ מלא את החסר</div>
    <div class="q-text">${q.prompt}</div>
    <div class="hint-box">💡 רמז: ${q.hint}</div>
    <input class="blank-input" id="fill-input" placeholder="הקלד תשובה..."
      onkeydown="if(event.key==='Enter')checkFill()">
    <div>
      <button class="btn-check" onclick="checkFill()">בדוק ✓</button>
    </div>
    <div class="feedback-box" id="feedback"></div>
  </div>`;
}

function checkFill(){
  const q=state.questions[state.qIndex];
  const val=document.getElementById('fill-input').value.trim().toLowerCase().replace(/\s/g,'');
  const ans=q.answer.toLowerCase().replace(/\s/g,'');
  const inp=document.getElementById('fill-input');
  inp.disabled=true;
  if(val===ans||val===ans.replace('^','')||(ans.includes(val)&&val.length>1)){
    inp.classList.add('correct');showFeedback(true,q.explanation);earnPoints(15);spawnConfetti();setTimeout(nextQuestion,2000);
  }else{
    inp.classList.add('wrong');inp.classList.add('shake');
    showFeedback(false,`התשובה הנכונה: **${q.answer}**. ${q.explanation}`);
    setTimeout(nextQuestion,3000);
  }
}

// ── HELPERS ──
function showFeedback(correct,text){
  const fb=document.getElementById('feedback');
  fb.className='feedback-box show '+(correct?'good':'bad');
  fb.innerHTML=(correct?'✅ ':'❌ ')+text;
  state.answers.push(correct);
  if(window.MathJax) MathJax.typesetPromise();
}

function earnPoints(pts){
  state.score+=pts;state.streak++;
  if(state.streak>=3) state.score+=5;
  animateScore(state.score);
  document.getElementById('streak-display').textContent=state.streak;
  document.getElementById('score-box').classList.remove('bump');
  void document.getElementById('score-box').offsetWidth;
  document.getElementById('score-box').classList.add('bump');
  saveState();
}

function animateScore(target){
  const el=document.getElementById('score-display');
  const start=parseInt(el.textContent)||0;
  const dur=600,steps=20,inc=(target-start)/steps;
  let i=0;
  const t=setInterval(()=>{
    i++;el.textContent=Math.round(start+inc*i);
    if(i>=steps){el.textContent=target;clearInterval(t);}
  },dur/steps);
}

function spawnConfetti(){
  const btn=document.querySelector('.btn-check')||document.querySelector('.choice-btn.correct')||document.querySelector('.tf-btn.correct');
  if(!btn) return;
  const r=btn.getBoundingClientRect();
  confetti(r.left+r.width/2,r.top);
}

function nextQuestion(){state.qIndex++;renderQuestion();}

function showResult(){
  const total=state.answers.length,correct=state.answers.filter(Boolean).length;
  const pct=total?Math.round(correct/total*100):0;
  let stars=pct>=80?3:pct>=50?2:1;
  if(!total) stars=0;
  state.topicStars[state.topicId]=Math.max(state.topicStars[state.topicId]||0,stars);
  saveState();
  const emojis=['😕','😐','🙂','🎉'];
  const titles=['נסה שוב','בסדר','כל הכבוד!','מושלם! 🌟'];
  document.getElementById('result-emoji').textContent=emojis[stars];
  document.getElementById('result-title').textContent=titles[stars];
  document.getElementById('result-score').textContent=`ענית נכון על ${correct} מתוך ${total} (${pct}%)`;
  document.getElementById('result-stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('result-breakdown').innerHTML=
    `<h3>פירוט:</h3>`+
    state.answers.map((a,i)=>
      `<div class="rb-row"><span>שאלה ${i+1}</span><span class="${a?'rb-ok':'rb-no'}">${a?'✓':'✗'}</span></div>`
    ).join('');
  document.getElementById('replay-btn').onclick=()=>openTopic(state.topicId);
  showScreen('result-screen');
  state.streak=0;
  document.getElementById('streak-display').textContent='0';
  if(stars===3) setTimeout(()=>{for(let i=0;i<3;i++) setTimeout(()=>confetti(window.innerWidth/2,window.innerHeight/3),i*300);},200);
  if(window.MathJax) MathJax.typesetPromise();
}

// ── BOOT ──
initHome();
</script>
</body>
</html>
