<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הוכחות אינפי 1 🎓</title>
<script>
MathJax = {
  tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$']], tags: 'none' },
  options: { skipHtmlTags: ['script','noscript','style','textarea'] }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="math-bg" id="math-bg"></div>

<header>
  <h1>🎓 אינפי 1 — משחק הוכחות</h1>
  <div id="hud">
    <div class="hud-box" id="score-box">ניקוד: <span class="val" id="score-display">0</span></div>
    <div class="hud-box" id="streak-box">🔥 <span class="val" id="streak-display">0</span></div>
  </div>
</header>

<div id="home" class="screen active">
  <div class="home-hero">
    <h2>משחק הוכחות אינפי 1</h2>
    <p class="home-sub">תרגל הוכחות מתמטיקה עם משחקים אינטראקטיביים<br>סדר שלבים · רב-ברירה · נכון/שקר · מילוי חסר</p>
    <div class="stats-bar">
      <div class="stat-chip">נושאים: <span id="stat-topics">0</span></div>
      <div class="stat-chip">ניקוד כולל: <span id="stat-score">0</span></div>
      <div class="stat-chip">הושלמו: <span id="stat-done">0</span></div>
    </div>
  </div>
  <div class="topic-grid" id="topic-grid"></div>
</div>

<div id="topic-screen" class="screen">
  <button class="back-btn" onclick="showHome()">← חזרה לנושאים</button>
  <div id="topic-title"></div>
  <div id="topic-desc"></div>
  <div class="mode-row" id="mode-row"></div>
  <div class="progress-row">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 0</div>
  </div>
  <div id="game-area"></div>
</div>

<div id="result-screen" class="screen">
  <span class="result-emoji" id="result-emoji">🎉</span>
  <div class="result-title" id="result-title">כל הכבוד!</div>
  <div class="result-score" id="result-score"></div>
  <div class="stars-row" id="result-stars"></div>
  <div class="result-breakdown" id="result-breakdown"></div>
  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <button class="btn-primary" onclick="showHome()">⬅ לנושאים</button>
    <button class="btn-primary" id="replay-btn">🔄 שחק שוב</button>
  </div>
</div>

<script src="data/topics.js"></script>
<script src="data/generated-topics.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/nav.js"></script>
<script src="js/main.js"></script>
</body>
</html>
